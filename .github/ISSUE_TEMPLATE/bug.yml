name: Bug 报告
description: 报告可稳定复现的错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请按顺序列出操作、使用的卡牌与所在回合。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、系统、分支或提交号
    validations:
      required: true
